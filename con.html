<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>등대시인 유현 (Flowsophia) | Lighthouse Poet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기존 스타일과 모달 스타일 통합 */
        body { font-family: 'Noto Sans KR', sans-serif; line-height: 1.8; color: #333333; background-color: #f8fafc; margin: 0; padding: 20px; word-break: keep-all; }
        .container { max-width: 800px; margin: 40px auto; background: #ffffff; padding: 60px 50px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.04); }
        
        /* 모달 오버레이 스타일 */
        .contact-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.35s ease; padding: 20px; }
        .contact-modal-overlay.active { opacity: 1; visibility: visible; }
        .contact-container { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal-btn { position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        
        /* 기존 스타일 보존 (h1, h2, 등 생략) */
        .hero-image-section { margin-bottom: 40px; text-align: center; }
        .hero-image-section img { width: 100%; max-width: 700px; border-radius: 15px; }
        h1 { color: #1a365d; font-size: 2.2rem; margin: 0; font-weight: 700; }
        .eng-title { font-family: 'Cormorant Garamond', serif; color: #4a5568; font-size: 1.5rem; font-style: italic; display: block; margin-bottom: 25px; }
        .contact-section { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: #ffffff; padding: 40px; border-radius: 16px; text-align: center; margin-top: 60px; cursor: pointer; transition: transform 0.2s; }
        .contact-section:hover { transform: translateY(-5px); }
        
        /* 폼 요소 스타일 */
        .form-group { margin-bottom: 20px; text-align: left; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { background: #3b76cc; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="hero-image-section"><img src="Flowsophia.png" alt="Flowsophia 등대시인 유현"></div>
        <h1>등대시인 유현</h1>
        <span class="eng-title">Lighthouse Poet, Yoo Hyeun</span>
    </header>

    <!-- 문의하기 버튼 섹션 (클릭 시 모달 실행) -->
    <div class="contact-section" onclick="openContactModal()">
        <h3>문의 및 소통 (Contact & Inquiries)</h3>
        <p>강연, 시 기고 및 협업을 위해 메일을 보내주세요.</p>
        <span style="font-weight:700; text-decoration: underline;">문의하기 클릭</span>
    </div>
</div>

<!-- 문의 모달창 -->
<div id="contactModalOverlay" class="contact-modal-overlay">
    <div class="contact-container">
        <button class="close-modal-btn" onclick="closeContactModal()"><i class="fa-solid fa-xmark"></i></button>
        <h2>Get in Touch</h2>
        <form id="contactForm" onsubmit="sendEmail(event)">
            <div class="form-group"><input type="text" id="subject" placeholder="Inquiry Topic"></div>
            <div class="form-group"><input type="text" id="name" placeholder="Name"></div>
            <div class="form-group"><input type="email" id="email" placeholder="Email Address"></div>
            <div class="form-group"><textarea id="message" placeholder="Message" rows="5"></textarea></div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>
</div>

<script>
    function openContactModal() { document.getElementById('contactModalOverlay').classList.add('active'); }
    function closeContactModal() { document.getElementById('contactModalOverlay').classList.remove('active'); }
    
    function sendEmail(event) {
        event.preventDefault();
        const sub = document.getElementById('subject').value;
        const msg = document.getElementById('message').value;
        const email = document.getElementById('email').value;
        window.location.href = `mailto:asiafield@msn.com?subject=[Contact] ${sub}&body=${msg}%0D%0A%0D%0AFrom: ${email}`;
        closeContactModal();
    }
</script>

</body>
</html>
