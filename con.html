<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>등대시인 유현 (Flowsophia) | Lighthouse Poet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; line-height: 1.8; color: #333333; background-color: #f8fafc; margin: 0; padding: 20px; word-break: keep-all; }
        .container { max-width: 800px; margin: 40px auto; background: #ffffff; padding: 60px 50px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.04); }
        .hero-image-section { margin-bottom: 40px; text-align: center; }
        .hero-image-section img { width: 100%; max-width: 700px; border-radius: 15px; }
        h1 { color: #1a365d; font-size: 2.2rem; margin: 0; font-weight: 700; }
        .eng-title { font-family: 'Cormorant Garamond', serif; color: #4a5568; font-size: 1.5rem; font-style: italic; display: block; margin-bottom: 25px; }
        
        /* 문의하기 섹션 스타일 (링크형으로 변경) */
        .contact-section { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: #ffffff; padding: 40px; border-radius: 16px; text-align: center; margin-top: 60px; text-decoration: none; display: block; transition: transform 0.2s; }
        .contact-section:hover { transform: translateY(-5px); }
        .contact-section h3 { margin-top: 0; margin-bottom: 10px; font-size: 1.5rem; }
        .contact-section .eng-sub { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; margin-bottom: 15px; opacity: 0.9; }
        .contact-section p { margin-bottom: 20px; font-size: 0.95rem; opacity: 0.95; }
        .contact-section .link-text { font-weight: 700; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="hero-image-section"><img src="Flowsophia.png" alt="Flowsophia 등대시인 유현"></div>
        <h1>등대시인 유현</h1>
        <span class="eng-title">Lighthouse Poet, Yoo Hyeun</span>
    </header>

    <!-- 문의 및 소통 섹션 (클릭 시 Flowsophia.com/contact.html로 이동) -->
    <a href="https://Flowsophia.com/contact.html" class="contact-section">
        <h3>문의 및 소통</h3>
        <div class="eng-sub">Contact & Inquiries</div>
        <p>강연, 시 기고 및 협업을 위해 메일을 보내주세요.</p>
        <span class="link-text">문의하기 클릭</span>
    </a>
</div>

</body>
</html>
