<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfaf5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .envelope-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
            background-image: radial-gradient(#e0dcd5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .title-banner {
            text-align: center;
            margin-bottom: 25px;
            padding: 22px;
            background: linear-gradient(135deg, #fff0f3 0%, #fff9e6 50%, #e8f4fd 100%);
            border-radius: 12px;
            border: 1.5px dashed #f3c68f;
        }

        .title-banner h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 26px;
            font-weight: 700;
            color: #d17a57;
            margin: 0 0 6px 0;
        }

        h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: #5d4037;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .form-group { margin-bottom: 18px; }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d7ccc8;
            border-radius: 6px;
            background: #fffcf8;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 15px;
            box-sizing: border-box;
            color: #4e342e;
        }

        .submit-btn {
            background: linear-gradient(135deg, #8d6e63, #6d4c41);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 6px;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="envelope-container">
        <div class="title-banner">
            <h1>💌 행복의 메일 박스 💌</h1>
            <p>소중한 마음을 담아 편지를 보내보세요</p>
        </div>
        
        <h2>마음을 전해주세요</h2>
        
        <form id="contactForm" onsubmit="sendEmail(event)">
            <div class="form-group">
                <input type="text" name="subject" id="subject" placeholder="어떤 이야기를 나누고 싶으신가요? (문의 주제)" required>
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <select name="titlePrefix" id="titlePrefix" style="width: 90px;">
                    <option value="Mr.">Mr.</option>
                    <option value="Ms.">Ms.</option>
                </select>
                <input type="text" name="name" id="name" placeholder="보내시는 분 성함" required>
            </div>
            <div class="form-group">
                <input type="text" name="mobile" id="mobile" placeholder="연락처">
            </div>
            <div class="form-group">
                <input type="email" name="email" id="email" placeholder="답변받으실 이메일 주소" required>
            </div>
            <div class="form-group">
                <textarea name="message" id="message" rows="5" placeholder="이곳에 편안하게 메시지를 적어주세요..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> 마음 보내기
            </button>
        </form>
    </div>

    <script>
        function sendEmail(event) {
            event.preventDefault();

            const subject = document.getElementById('subject').value;
            const titlePrefix = document.getElementById('titlePrefix').value;
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            // 받는 사람 이메일 (여기에 본인의 이메일을 입력하세요)
            const recipient = "asiafield@msn.com";
            
            const bodyContent = `보내는 분: ${titlePrefix} ${name}%0D%0A연락처: ${mobile}%0D%0A이메일: ${email}%0D%0A%0D%0A내용:%0D%0A${message}`;
            
            const mailtoLink = `mailto:${recipient}?subject=[Blog Inquiry] ${encodeURIComponent(subject)}&body=${bodyContent}`;
            
            window.location.href = mailtoLink;
        }
    </script>
</body>
</html>
