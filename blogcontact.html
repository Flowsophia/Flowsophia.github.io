<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <!-- 예쁜 손글씨 및 캘리그라피 느낌을 주는 한글 폰트(Bagel Fat One / Nanum Myeongjo) 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nanum+Myeongjo:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfaf5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .envelope-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
            background-image: 
                radial-gradient(#e0dcd5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 화사하고 다채로운 타이틀 디자인 영역 */
        .title-banner {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #fff0f3 0%, #fff9e6 50%, #e8f4fd 100%);
            border-radius: 12px;
            border: 1.5px dashed #f3c68f;
            box-shadow: 0 4px 15px rgba(243, 198, 143, 0.2);
        }

        .title-banner h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff7e5f, #feb47b, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .title-banner p {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 14px;
            color: #8c7b75;
            margin: 0;
        }

        h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: #5d4037;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d7ccc8;
            border-radius: 6px;
            background: #fffcf8;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 15px;
            box-sizing: border-box;
            color: #4e342e;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #8d6e63;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(141, 110, 99, 0.15);
        }

        .submit-btn {
            background: linear-gradient(135deg, #8d6e63, #6d4c41);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 6px;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .submit-btn:hover { 
            opacity: 0.9; 
        }
    </style>
</head>
<body>

    <div class="envelope-container">
        <!-- 이미지 대신 들어간 화사하고 예쁜 '행복의 메일 박스' 타이틀 배너 -->
        <div class="title-banner">
            <h1>✨ 행복의 메일 박스 ✨</h1>
            <p>소중한 마음을 담아 편지를 보내보세요</p>
        </div>
        
        <h2>마음을 전해주세요</h2>
        
        <form id="contactForm" onsubmit="sendEmail(event)">
            <div class="form-group">
                <input type="text" id="subject" placeholder="어떤 이야기를 나누고 싶으신가요? (문의 주제)">
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <select id="titlePrefix" style="width: 90px;">
                    <option value="Mr.">Mr.</option>
                    <option value="Ms.">Ms.</option>
                </select>
                <input type="text" id="name" placeholder="보내시는 분 성함">
            </div>
            <div class="form-group">
                <input type="text" id="mobile" placeholder="연락처 (예: 010-0000-0000)">
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="답변받으실 이메일 주소">
            </div>
            <div class="form-group">
                <textarea id="message" rows="5" placeholder="이곳에 편안하게 메시지를 적어주세요..."></textarea>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> 마음 보내기
            </button>
        </form>
    </div>

    <script>
        function sendEmail(event) {
            event.preventDefault();
            
            const subject = document.getElementById('subject').value.trim();
            const titlePrefix = document.getElementById('titlePrefix').value;
            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!subject || !name || !email || !message) {
                alert('빈칸 없이 내용을 정성껏 채워주세요!');
                return;
            }

            const recipient = "asiafield@msn.com";
            const emailSubject = `[행복의 메일박스] ${subject}`;
            const bodyContent = `보내는 사람: ${titlePrefix} ${name}%0D%0A연락처: ${mobile}%0D%0A이메일: ${email}%0D%0A%0D%0A---%0D%0A%0D%0A${message}`;

            window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(emailSubject)}&body=${bodyContent}`;
        }
    </script>
</body>
</html>
