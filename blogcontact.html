<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfaf5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .envelope-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
            background-image: 
                radial-gradient(#e0dcd5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 화사하고 예쁜 캘리그라피풍 타이틀 배너 */
        .title-banner {
            text-align: center;
            margin-bottom: 25px;
            padding: 22px;
            background: linear-gradient(135deg, #fff0f3 0%, #fff9e6 50%, #e8f4fd 100%);
            border-radius: 12px;
            border: 1.5px dashed #f3c68f;
            box-shadow: 0 4px 15px rgba(243, 198, 143, 0.2);
        }

        .title-banner h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 26px;
            font-weight: 700;
            color: #d17a57;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .title-banner p {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 14px;
            color: #8c7b75;
            margin: 0;
        }

        h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: #5d4037;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d7ccc8;
            border-radius: 6px;
            background: #fffcf8;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 15px;
            box-sizing: border-box;
            color: #4e342e;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #8d6e63;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(141, 110, 99, 0.15);
        }

        .submit-btn {
            background: linear-gradient(135deg, #8d6e63, #6d4c41);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 6px;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .submit-btn:hover { 
            opacity: 0.9; 
        }
    </style>
</head>
<body>

    <div class="envelope-container">
        <div class="title-banner">
            <h1>💌 행복의 메일 박스 💌</h1>
            <p>소중한 마음을 담아 편지를 보내보세요</p>
        </div>
        
        <h2>마음을 전해주세요</h2>
        
        <!-- Formspree 연동 (action 주소에 본인의 Form ID를 입력하세요) -->
        <form id="contactForm" action="https://formspree.io/f/your_form_id" method="POST" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <input type="text" name="subject" id="subject" placeholder="어떤 이야기를 나누고 싶으신가요? (문의 주제)" required>
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <select name="titlePrefix" id="titlePrefix" style="width: 90px;">
                    <option value="Mr.">Mr.</option>
                    <option value="Ms.">Ms.</option>
                </select>
                <input type="text" name="name" id="name" placeholder="보내시는 분 성함" required>
            </div>
            <div class="form-group">
                <input type="text" name="mobile" id="mobile" placeholder="연락처 (예: 010-0000-0000)">
            </div>
            <div class="form-group">
                <input type="email" name="email" id="email" placeholder="답변받으실 이메일 주소" required>
            </div>
            <div class="form-group">
                <textarea name="message" id="message" rows="5" placeholder="이곳에 편안하게 메시지를 적어주세요..." required></textarea>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> 마음 보내기
            </button>
        </form>
    </div>

    <script>
        async function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = document.getElementById('submitBtn');
            const data = new FormData(form);

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 전송 중...';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    alert('성공적으로 메시지가 전송되었습니다!');
                    form.reset();
                } else {
                    alert('전송에 실패했습니다. 다시 시도해 주세요.');
                }
            } catch (error) {
                alert('네트워크 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 마음 보내기';
            }
        }
    </script>
</body>
</html>
