<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 부드럽고 친근한 폰트 (Outfit / Plus Jakarta Sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* 따뜻하고 편안한 파스텔 톤 그라데이션 배경 */
            background: linear-gradient(135deg, #fcefee 0%, #e8f0fe 100%);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }

        .contact-container {
            /* 몽환적이고 부드러운 글래스모피즘 & 소프트 섀도우 스타일 */
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            padding: 45px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(74, 144, 226, 0.08);
            width: 100%;
            max-width: 520px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        h2 {
            margin: 0 0 10px 0;
            color: #2b4c7e;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 0;
            color: #7f8c8d;
            font-size: 15px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
            letter-spacing: -0.2px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2c3e50;
            background-color: #fcfdfe;
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: #5c93df;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(92, 147, 223, 0.12), inset 0 1px 2px rgba(0, 0, 0, 0.01);
            outline: none;
        }

        /* 셀렉트박스 커스텀 화살표 */
        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237f8c8d' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        .name-group {
            display: flex;
            gap: 12px;
        }

        .title-select {
            flex: 0 0 110px;
        }

        .name-input {
            flex: 1;
            min-width: 0;
        }

        .mobile-group {
            display: flex;
            gap: 12px;
        }

        .country-code {
            flex: 0 0 180px;
        }

        .mobile-number {
            flex: 1;
            min-width: 0;
        }

        textarea {
            resize: vertical;
            height: 150px;
            line-height: 1.5;
        }

        .submit-btn {
            background: linear-gradient(135deg, #5c93df 0%, #3b76cc 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(59, 118, 204, 0.25);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 118, 204, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* 플레이스홀더 색상 부드럽게 조정 */
        ::placeholder {
            color: #a0aec0;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="header-section">
            <h2>Get in Touch</h2>
            <p class="subtitle">Please feel free to drop us a message anytime!</p>
        </div>

        <form id="contactForm" onsubmit="sendEmail(event)">
            <div class="form-group">
                <label for="subject">Inquiry Type/Topic</label>
                <input type="text" id="subject" name="subject" placeholder="e.g., General Inquiry, Partnership" required>
            </div>

            <div class="form-group">
                <label for="name">Enter your full Name</label>
                <div class="name-group">
                    <select id="titlePrefix" name="titlePrefix" class="title-select" required>
                        <option value="Mr.">Mr.</option>
                        <option value="Ms.">Ms.</option>
                        <option value="Miss">Miss</option>
                    </select>
                    <input type="text" id="name" name="name" class="name-input" placeholder="Your name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="mobile">Enter your phone number</label>
                <div class="mobile-group">
                    <select id="countryCode" name="countryCode" class="country-code" required>
                        <option value="+93">Afghanistan (+93)</option>
                        <option value="+355">Albania (+355)</option>
                        <option value="+213">Algeria (+213)</option>
                        <option value="+54">Argentina (+54)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+43">Austria (+43)</option>
                        <option value="+880">Bangladesh (+880)</option>
                        <option value="+32">Belgium (+32)</option>
                        <option value="+55">Brazil (+55)</option>
                        <option value="+1">Canada (+1)</option>
                        <option value="+56">Chile (+56)</option>
                        <option value="+86">China (+86)</option>
                        <option value="+57">Colombia (+57)</option>
                        <option value="+420">Czech Republic (+420)</option>
                        <option value="+45">Denmark (+45)</option>
                        <option value="+20">Egypt (+20)</option>
                        <option value="+358">Finland (+358)</option>
                        <option value="+33">France (+33)</option>
                        <option value="+49">Germany (+49)</option>
                        <option value="+30">Greece (+30)</option>
                        <option value="+852">Hong Kong (+852)</option>
                        <option value="+36">Hungary (+36)</option>
                        <option value="+91">India (+91)</option>
                        <option value="+62">Indonesia (+62)</option>
                        <option value="+353">Ireland (+353)</option>
                        <option value="+972">Israel (+972)</option>
                        <option value="+39">Italy (+39)</option>
                        <option value="+81">Japan (+81)</option>
                        <option value="+60">Malaysia (+60)</option>
                        <option value="+52">Mexico (+52)</option>
                        <option value="+31">Netherlands (+31)</option>
                        <option value="+64">New Zealand (+64)</option>
                        <option value="+47">Norway (+47)</option>
                        <option value="+92">Pakistan (+92)</option>
                        <option value="+63">Philippines (+63)</option>
                        <option value="+48">Poland (+48)</option>
                        <option value="+351">Portugal (+351)</option>
                        <option value="+40">Romania (+40)</option>
                        <option value="+7">Russia (+7)</option>
                        <option value="+966">Saudi Arabia (+966)</option>
                        <option value="+65">Singapore (+65)</option>
                        <option value="+27">South Africa (+27)</option>
                        <option value="+82" selected>South Korea (+82)</option>
                        <option value="+34">Spain (+34)</option>
                        <option value="+46">Sweden (+46)</option>
                        <option value="+41">Switzerland (+41)</option>
                        <option value="+886">Taiwan (+886)</option>
                        <option value="+66">Thailand (+66)</option>
                        <option value="+90">Turkey (+90)</option>
                        <option value="+380">Ukraine (+380)</option>
                        <option value="+971">United Arab Emirates (+971)</option>
                        <option value="+44">United Kingdom (+44)</option>
                        <option value="+1">United States (+1)</option>
                        <option value="+84">Vietnam (+84)</option>
                    </select>
                    <input type="text" id="mobile" name="mobile" class="mobile-number" placeholder="Phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">eMail</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <span>Send Message</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        function sendEmail(event) {
            event.preventDefault();

            const subject = document.getElementById('subject').value;
            const titlePrefix = document.getElementById('titlePrefix').value;
            const name = document.getElementById('name').value;
            const countryCode = document.getElementById('countryCode').value;
            const mobileNumber = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            if (!subject || !titlePrefix || !name || !countryCode || !mobileNumber || !email || !message) {
                alert('Please fill in all fields completely.');
                return;
            }

            const fullMobile = `${countryCode} ${mobileNumber}`;
            const recipient = "asiafield@msn.com";
            
            const bodyContent = `Dear Sir,%0D%0A%0D%0AMy name is ${titlePrefix} ${name}.%0D%0A%0D%0A${message}%0D%0A%0D%0ABest Regards,%0D%0A${titlePrefix} ${name}%0D%0A%0D%0A---%0D%0AMobile: ${fullMobile}%0D%0AeMail: ${email}`;
            
            window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${bodyContent}`;
        }
    </script>

</body>
</html>
