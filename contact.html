<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- 아이콘 사용을 위한 FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 친근한 느낌을 위한 Google Fonts 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        /* 1) 'Get in Touch' 스타일 변경 */
        h2 {
            margin-bottom: 25px;
            color: #4a90e2; /* 친근한 블루 계열 색상 */
            text-align: center;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: #4a90e2;
            outline: none;
        }

        .name-group {
            display: flex;
            gap: 10px;
        }

        .title-select {
            flex: 0 0 110px;
        }

        .name-input {
            flex: 1;
        }

        .mobile-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            flex: 0 0 130px;
        }

        .mobile-number {
            flex: 1;
        }

        textarea {
            resize: vertical;
            height: 150px;
        }

        .submit-btn {
            background-color: #4a90e2; /* 버튼 색상 통일 */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <!-- 1) Get in Touch -->
        <h2>Get in Touch</h2>
        <form id="contactForm" onsubmit="sendEmail(event)">
            <!-- 2) Inquiry Type/Topic -->
            <div class="form-group">
                <label for="subject">Inquiry Type/Topic:</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <!-- 3) Enter your full Name -->
            <div class="form-group">
                <label for="name">Enter your full Name:</label>
                <div class="name-group">
                    <select id="titlePrefix" name="titlePrefix" class="title-select" required>
                        <option value="Mr.">Mr.</option>
                        <option value="Ms.">Ms.</option>
                        <option value="Miss">Miss</option>
                    </select>
                    <input type="text" id="name" name="name" class="name-input" placeholder="Enter your name" required>
                </div>
            </div>

            <!-- 4) Enter your phone number -->
            <div class="form-group">
                <label for="mobile">Enter your phone number:</label>
                <div class="mobile-group">
                    <select id="countryCode" name="countryCode" class="country-code" required>
                        <option value="+82">South Korea (+82)</option>
                        <option value="+1">USA/Canada (+1)</option>
                        <option value="+81">Japan (+81)</option>
                        <option value="+86">China (+86)</option>
                        <option value="+44">UK (+44)</option>
                        <option value="+49">Germany (+49)</option>
                        <option value="+33">France (+33)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+65">Singapore (+65)</option>
                        <option value="+84">Vietnam (+84)</option>
                    </select>
                    <input type="text" id="mobile" name="mobile" class="mobile-number" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">eMail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <!-- 5) Send Message -->
            <button type="submit" class="submit-btn">
                <span>Send Message</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        function sendEmail(event) {
            event.preventDefault();

            const subject = document.getElementById('subject').value;
            const titlePrefix = document.getElementById('titlePrefix').value;
            const name = document.getElementById('name').value;
            const countryCode = document.getElementById('countryCode').value;
            const mobileNumber = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            if (!subject || !titlePrefix || !name || !countryCode || !mobileNumber || !email || !message) {
                alert('모든 항목을 빠짐없이 입력해 주세요.');
                return;
            }

            const fullMobile = `${countryCode} ${mobileNumber}`;
            const recipient = "asiafield@msn.com";
            
            const bodyContent = `Dear Sir,%0D%0A%0D%0AMy name is ${titlePrefix} ${name}.%0D%0A%0D%0A${message}%0D%0A%0D%0ABest Regards,%0D%0A${titlePrefix} ${name}%0D%0A%0D%0A---%0D%0AMobile: ${fullMobile}%0D%0AeMail: ${email}`;
            
            window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${bodyContent}`;
        }
    </script>

</body>
</html>
