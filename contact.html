<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-container {
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
        }

        h2 {
            margin-bottom: 30px;
            color: #4a90e2;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #333;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.12);
            outline: none;
        }

        /* 셀렉트박스 커스텀 화살표 및 디자인 개선 */
        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            padding-right: 35px;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .name-group {
            display: flex;
            gap: 10px;
        }

        .title-select {
            flex: 0 0 95px;
        }

        .name-input {
            flex: 1;
            min-width: 0;
        }

        .mobile-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            flex: 0 0 160px;
        }

        .mobile-number {
            flex: 1;
            min-width: 0;
        }

        textarea {
            resize: vertical;
            height: 140px;
        }

        .submit-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #357abd;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h2>Get in Touch</h2>
        <form id="contactForm" onsubmit="sendEmail(event)">
            <div class="form-group">
                <label for="subject">Inquiry Type/Topic:</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
                <label for="name">Enter your full Name:</label>
                <div class="name-group">
                    <select id="titlePrefix" name="titlePrefix" class="title-select" required>
                        <option value="Mr.">Mr.</option>
                        <option value="Ms.">Ms.</option>
                        <option value="Miss">Miss</option>
                    </select>
                    <input type="text" id="name" name="name" class="name-input" placeholder="Enter your name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="mobile">Enter your phone number:</label>
                <div class="mobile-group">
                    <select id="countryCode" name="countryCode" class="country-code" required>
                        <option value="+82">Korea (+82)</option>
                        <option value="+1">USA / Canada (+1)</option>
                        <option value="+81">Japan (+81)</option>
                        <option value="+86">China (+86)</option>
                        <option value="+44">UK (+44)</option>
                        <option value="+49">Germany (+49)</option>
                        <option value="+33">France (+33)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+65">Singapore (+65)</option>
                        <option value="+84">Vietnam (+84)</option>
                    </select>
                    <input type="text" id="mobile" name="mobile" class="mobile-number" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">eMail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <span>Send Message</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        function sendEmail(event) {
            event.preventDefault();

            const subject = document.getElementById('subject').value;
            const titlePrefix = document.getElementById('titlePrefix').value;
            const name = document.getElementById('name').value;
            const countryCode = document.getElementById('countryCode').value;
            const mobileNumber = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            if (!subject || !titlePrefix || !name || !countryCode || !mobileNumber || !email || !message) {
                alert('Please fill in all fields completely.');
                return;
            }

            const fullMobile = `${countryCode} ${mobileNumber}`;
            const recipient = "asiafield@msn.com";
            
            const bodyContent = `Dear Sir,%0D%0A%0D%0AMy name is ${titlePrefix} ${name}.%0D%0A%0D%0A${message}%0D%0A%0D%0ABest Regards,%0D%0A${titlePrefix} ${name}%0D%0A%0D%0A---%0D%0AMobile: ${fullMobile}%0D%0AeMail: ${email}`;
            
            window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${bodyContent}`;
        }
    </script>

</body>
</html>
