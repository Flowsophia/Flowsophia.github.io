                우리는 세상의 미움과 공포를 외면하거나 부정하지 않습니다. 그조차도 삶의 거대한 흐름 일부임을 인정하는 것.<br>
                그 흐름 속에서 길어 올린 '따뜻한 지혜'는 당신이 스스로 화해와 용기의 길을 찾아갈 수 있게 돕는 유일한 지도입니다.
